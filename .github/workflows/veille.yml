name: Veille pluviometrique

# MODE A BLANC. Le cron detecte, il ecrit etat.json, et c'est tout.
#
# Il n'appelle ni Mailjet ni Vision : aucun secret n'est declare dans ce
# workflow, et il ne peut donc pas en utiliser. La seule sortie reseau est
# Open-Meteo, API publique en lecture, sans identifiant.
#
# LE DEPOT EST PUBLIC. Les logs de ce workflow le sont aussi : on n'y ecrit
# jamais d'adresse email. verif_etat.py refuse le commit s'il en trouve une
# dans etat.json.

on:
  schedule:
    # 11 h 17 Paris en heure d'ete : « 17 9 * * * » UTC. A partir du
    # 25 octobre 2026, passer a « 17 10 * * * ». Les deux lignes sont ecrites,
    # une seule est active : decommenter l'autre le 25/10/2026.
    #
    # Minute 17 et non 0 : GitHub retarde davantage les taches programmees en
    # debut d'heure, la plus chargee. Mesure du 15/09 au 01/10/2026 a la
    # minute 0 : retard median 5 h 07, jusqu'a 8 h 22. L'horaire ecrit ici
    # est un horaire de depart AU PLUS TOT, pas une heure d'execution.
    - cron: "17 9 * * *"
    # - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Pose pour tout le job : le controle d'environnement et la detection
    # doivent voir exactement la meme valeur.
    env:
      VP_ETAT: etat.json
      VP_EXIGE_ETAT: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controle de l'environnement — VP_ETAT
        # CONTROLE DUR. Sans etat, le moteur repartirait de zero a chaque tour
        # et reproposerait en boucle des departements deja traites. Une panne
        # silencieuse qui produit des envois en double est pire qu'un run
        # rouge : on echoue avant d'avoir rien fait.
        run: |
          if [ -z "${VP_ETAT:-}" ]; then
            echo "ECHEC : VP_ETAT n'est pas defini."
            exit 1
          fi
          if [ ! -f "$VP_ETAT" ]; then
            echo "ECHEC : VP_ETAT pointe sur un fichier introuvable : $VP_ETAT"
            exit 1
          fi
          python -c "import json,io,sys; d=json.load(io.open('$VP_ETAT',encoding='utf-8'));             print('OK    | %s lisible, version %s, bascule %r' % ('$VP_ETAT', d.get('version'), d.get('bascule')));             sys.exit(0 if d.get('version') == 2 else 1)"

      - name: Non-regression moteur.py contre index.html
        # Les deux implementations doivent produire le meme texte. Si elles
        # divergent, on ne publie pas un etat que la page interpreterait
        # autrement.
        run: python test_coherence.py

      - name: Detection
        # VP_ETAT et VP_EXIGE_ETAT sont poses au niveau du job, plus haut.
        run: python moteur.py > veille.json

      - name: Mise a jour de etat.json
        run: python maj_etat.py veille.json

      - name: Controle avant commit — aucune adresse dans etat.json
        # Garde-fou dur. S'il trouve un « @ » suivi d'un point, ou un champ
        # au nom evoquant un destinataire, il sort en erreur et rien n'est
        # commite.
        run: python verif_etat.py

      - name: Commit si etat.json a change
        run: |
          if git diff --quiet -- etat.json; then
            echo "etat.json inchange, rien a commiter."
            exit 0
          fi
          git config user.name  "veille-pluvio"
          git config user.email "veille-pluvio@users.noreply.github.com"
          git add etat.json
          git commit -m "Veille du $(date -u +%Y-%m-%d) — detection automatique"
          git push

      - name: Ne pas garder la sortie brute
        # veille.json ne contient pas d'adresse, mais il n'a pas a etre
        # publie : il est regenere a chaque execution.
        if: always()
        run: rm -f veille.json

  notifier:
    # Alerte si le job precedent a ECHOUE ou a ete ANNULE.
    #
    # Le 17/09/2026, la detection a depasse ses 15 minutes : GitHub a annule le
    # job, et un job annule n'est pas en echec. Avec « if: failure() », cette
    # alerte a ete sautee : une journee perdue sans que personne le sache.
    #
    # On teste donc explicitement le resultat du job precedent. « always() »
    # garantit que cette condition est evaluee quel que soit ce resultat ;
    # « cancelled() » ne suffirait pas, il dit si TOUT le run a ete annule,
    # pas si le job precedent a depasse son delai.
    needs: veille
    if: always() && (needs.veille.result == 'failure' || needs.veille.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir une issue d'echec
        uses: actions/github-script@v7
        env:
          RESULTAT: ${{ needs.veille.result }}
        with:
          script: |
            const annule = process.env.RESULTAT === "cancelled";
            const titre = `Veille pluviometrique ${annule ? "annulee" : "en echec"} — ${new Date().toISOString().slice(0,10)}`;
            const corps = annule ? [
              "**La tache planifiee a ete ANNULEE. Aucun etat n'a ete publie aujourd'hui.**",
              "",
              `Execution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Cause la plus probable : le job a depasse ses 15 minutes (timeout-minutes),",
              "en general parce qu'Open-Meteo repondait lentement, comme le 17/09/2026.",
              "Sinon : annulation manuelle depuis l'onglet Actions.",
              "",
              "Le prochain tour planifie reprendra normalement.",
              "La page continue d'afficher le dernier etat publie.",
            ].join("\n") : [
              "La tache planifiee a echoue. Aucun etat n'a ete publie.",
              "",
              `Execution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Causes possibles, par ordre de frequence :",
              "- Open-Meteo indisponible ou trop de departements en erreur",
              "- divergence entre moteur.py et index.html (test_coherence.py)",
              "- verif_etat.py a refuse le commit : une adresse a ete trouvee dans etat.json",
              "",
              "La page continue d'afficher le dernier etat publie.",
            ].join("\n");
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "veille-echec",
            });
            if (ouvertes.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ["veille-echec"],
              });
            }
