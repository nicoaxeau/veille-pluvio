name: Essai sur la branche meteofrance

# ESSAI A LA MAIN, SUR LA BRANCHE meteofrance SEULEMENT. A supprimer avant la
# fusion dans main, avec sa ligne dans .gitignore et la partie « workflow_call »
# de veille.yml.
#
# Le workflow « Veille pluviometrique » (veille.yml) est desactive et le reste :
# le reactiver, meme une minute, rouvrirait son passage programme sur main, qui
# appelle encore Open-Meteo. Le bouton « Run workflow » n'existe que pour un
# workflow present sur main : on ne s'en sert donc pas.
#
# Ce fichier n'a aucun horaire. Il ne part que lorsqu'un push sur la branche
# meteofrance le modifie : c'est ce push qui lance l'essai, et rien d'autre.
# Il fait tourner veille.yml de la branche, tel quel, et n'ecrit que sur la
# branche : pluie.json, etat.json, et des issues marquees « essai ».
#
# essai_privas : une alerte fabriquee, Privas muette, pour prouver sur GitHub
# que l'issue s'ouvre au premier essai, puis se complete au second au lieu de
# se doubler. Decision de Nicolas du 07/10/2026.
#
# Essai n° 1

on:
  push:
    branches: [meteofrance]
    paths: [".github/workflows/essai-branche.yml"]

permissions:
  contents: write
  issues: write

jobs:
  essai:
    uses: ./.github/workflows/veille.yml
    with:
      essai_privas: true
